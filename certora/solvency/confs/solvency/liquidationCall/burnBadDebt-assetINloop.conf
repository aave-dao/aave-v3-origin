{
	"assert_autofinder_success": true,
	//"build_cache": true,
	"cache": "aave_inv",
	"files": [
                "certora/solvency/harnesses/Aave/PoolInstanceHarness.sol"
	],
        "disable_solc_optimizers": ["cse","peephole"],
	"java_args": [" -ea -Dlevel.setup.helpers=info"],
	"msg": "SOLVENCY - _burnBadDebt - asset==loopAsset",
	"optimistic_loop": true,
	"process": "emv",
//	"prover_args": [" -split false"	],
	// Without twostage destructive optimizations solvency__burnBadDebt does not
	// finish: the INTR2/INTR1 totSUP-debt assert alone exhausts smt_timeout.
	"prover_args": [" -destructiveOptimizations twostage"],
        "server": "prover",               
	"smt_timeout": "6000",
	"solc": "solc8.27",
    "solc_via_ir": true,
	"solc_optimize": "200",
        "rule_sanity": "basic",
        "multi_assert_check" : true,
	"verify": "PoolInstanceHarness:certora/solvency/specs/liquidationCall/burnBadDebt-assetINloop.spec"
}
